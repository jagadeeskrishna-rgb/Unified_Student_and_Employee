{% extends "lifecycle/base.html" %}
{% block content %}
<div class="auth-panel">
  <h1>Portal Login</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <a href="{% url 'register' %}" class="small-link">Create demo account</a>
</div>
{% endblock %}
