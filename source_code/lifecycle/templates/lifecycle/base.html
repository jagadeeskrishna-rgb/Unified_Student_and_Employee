<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unified Lifecycle Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}<link href="{% static 'lifecycle/styles.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'dashboard' %}">Lifecycle Portal</a>
    <div class="navbar-nav">
      {% if user.is_authenticated %}
      <a class="nav-link" href="{% url 'students' %}">Students</a>
      <a class="nav-link" href="{% url 'employees' %}">Employees</a>
      <a class="nav-link" href="{% url 'companies' %}">Companies</a>
      <a class="nav-link" href="{% url 'salary_records' %}">Salary</a>
      <a class="nav-link" href="{% url 'salary_queries' %}">Queries</a>
      <a class="nav-link" href="{% url 'verification_issues' %}">Verification</a>
      <a class="nav-link" href="{% url 'resume' %}">Resume</a>
      <form action="{% url 'logout' %}" method="post" class="d-inline">{% csrf_token %}<button class="nav-link btn btn-link">Logout</button></form>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
